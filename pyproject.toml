[project]
name = "ml-airflow-hw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy==1.4.52",
    "omegaconf>=2.3.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E, W - стандартные ошибки pycodestyle
# F - pyflakes
# I - isort (сортировка импортов)
# B - flake8-bugbear (поиск багов)
select = ["E", "W", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["docs/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
